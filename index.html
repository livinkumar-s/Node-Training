<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <form onsubmit="handlesubmit(event)">
        <input type="email" name="email" id="email">
        <input type="password" name="password" id="password">
        <button>submit</button>
    </form>

    <button onclick="getAllNotes()">Get all notes</button>


    <script>
        async function handlesubmit(e) {
            e.preventDefault()
            const email = document.getElementById("email").value
            const password = document.getElementById("password").value
            console.log({
                email, password
            });

            const response = await fetch("https://node-training-backend.vercel.app/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email, password
                })
            })
        }

        async function getAllNotes() {
            const response = await fetch("https://node-training-backend.vercel.app/api/notes/allnotes",{
                method:"GET",
                credentials:"include"
            })
            if (response.ok) {
                const data = await response.json()
                console.log(data);

            }
        }

    </script>

</body>

</html>
